<div
  class="card bg-base-100 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-500 overflow-hidden group border border-base-300 h-full"
>
  <figure class="relative overflow-hidden">
    <img
      [src]="place.image || 'https://placehold.co/600x400'"
      alt="Lugar"
      class="group-hover:scale-110 transition-transform duration-700 w-full h-56 object-cover"
    />
    <div class="absolute top-4 right-4 badge badge-base-100 font-bold gap-2 p-3 shadow-lg">
      <span class="text-yellow-500 text-xl">★</span>
      {{ place.rating || 0 }}
    </div>

    <button
      (click)="onToggleFavoriteClick($event)"
      class="absolute top-4 left-4 btn btn-circle btn-sm bg-base-100/80 border-none backdrop-blur-sm shadow-md hover:scale-110 transition-all"
    >
      <span class="text-lg">
        {{ place.isFavorite ? '❤️' : '🤍' }}
      </span>
    </button>
  </figure>

  <div class="card-body p-6">
    <h3 class="card-title text-2xl font-bold group-hover:text-primary transition-colors">
      {{ place.name || 'Cargando...' }}
    </h3>

   <div class="flex items-center gap-1 text-sm opacity-70 mb-2">
      <span class="text-secondary">📍</span>
      {{ place.location.city || 'Ubicación desconocida' }}
    </div>

    <p class="text-sm font-light line-clamp-2 italic">
      Perfect@ <strong> {{ place.category }} </strong> para descubrir en {{ place.location.city }}.
    </p>

    <div class="card-actions justify-end mt-6">
      <button
        class="btn btn-primary btn-sm btn-outline hover:scale-105 transition-all"
        [routerLink]="['/places', place.id]"
      >
        Ver detalles
      </button>
    </div>
  </div>
</div>
