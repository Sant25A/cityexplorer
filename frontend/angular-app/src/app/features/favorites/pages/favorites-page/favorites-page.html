<section class="space-y-10">

  <!-- TÍTULO -->
  <div class="text-center">
    <h1 class="text-4xl font-bold text-primary">
      Mis lugares favoritos
    </h1>
    <p class="opacity-60 mt-2">
      Aquí puedes ver los lugares que has guardado ❤️
    </p>
  </div>

  <!-- GRID (SI HAY FAVORITOS) -->
  <div *ngIf="favorites.length > 0; else emptyState"
       class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <app-place-card
      *ngFor="let place of favorites"
      [place]="place"
      (toggleFavorite)="onToggleFavorite($event)"
    ></app-place-card>

  </div>

  <!-- ESTADO VACÍO -->
  <ng-template #emptyState>
    <div class="flex flex-col items-center justify-center text-center mt-20 space-y-6">

      <div class="text-6xl opacity-30">
        💔
      </div>

      <h2 class="text-2xl font-semibold">
        No tienes favoritos aún
      </h2>

      <p class="opacity-60 max-w-md">
        Guarda lugares que te gusten y aparecerán aquí para acceder rápidamente.
      </p>

      <a routerLink="/places" class="btn btn-primary">
        Explorar lugares
      </a>

    </div>
  </ng-template>

</section>
