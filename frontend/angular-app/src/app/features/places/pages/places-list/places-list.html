<section class="space-y-8 animate-fade-in">
  <div class="flex flex-col md:flex-row gap-4 bg-base-200 p-6 rounded-2xl shadow-sm">
    <div class="relative w-full">
      <input
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        (input)="onSearchChange()"
        (keyup.enter)="applyFilters()"
        type="text"
        placeholder="¿Qué estás buscando? (ej: café, museo...)"
        class="input input-bordered w-full pl-10 bg-base-100 text-base-content"
      />
      <span class="absolute left-3 top-3 opacity-40">🔍</span>
    </div>

    <div class="flex gap-2 w-full md:w-auto">
      <button
        (click)="applyFilters()"
        class="btn btn-primary flex-grow md:flex-none px-8 shadow-lg shadow-primary/20"
      >
        Buscar
      </button>

      <button
        type="button"
        (click)="search.set(''); selectedCategory.set(''); selectedCity.set(''); applyFilters()"
        class="btn btn-accent flex-grow md:flex-none px-4 shadow-lg shadow-primary/20"
        title="Restablecer todos los filtros"
      >
        <span class="inline md:hidden lg:inline">Limpiar</span>
      </button>
    </div>
  </div>

  <div class="flex flex-col md:flex-row gap-4">
    <div class="w-full">
      <label class="label opacity-60 text-xs font-bold uppercase tracking-widest">Ciudad/Localidad</label>
      <select
        [ngModel]="selectedCity()"
        (ngModelChange)="selectedCity.set($event); applyFilters()"
        class="select select-bordered w-full"
      >
        <option value="">Todas las ciudades/localidades</option>
        <option *ngFor="let city of cities()" [value]="city">
          {{ city }}
        </option>
      </select>
    </div>

    <div class="w-full">
      <label class="label opacity-60 text-xs font-bold uppercase tracking-widest">Categoría</label>
      <select
        [ngModel]="selectedCategory()"
        (ngModelChange)="selectedCategory.set($event); applyFilters()"
        class="select select-bordered w-full"
      >
        <option value="">Todas las categorías</option>
        <option value="cafe">Café</option>
        <option value="restaurante">Restaurante</option>
        <option value="parque">Parque</option>
        <option value="bar">Bar</option>
        <option value="museo">Museo</option>
        <option value="hotel">Hotel</option>
        <option value="tienda">Tienda</option>
        <option value="atraccion">Atracción</option>
        <option value="naturaleza">Naturaleza</option>
        <option value="otro">Otro</option>
      </select>
    </div>
  </div>

  <div class="w-full">
    <label class="label opacity-60 text-xs font-bold uppercase">Ordenar por</label>
    <select
      [ngModel]="sort()"
      (ngModelChange)="sort.set($event); applyFilters()"
      class="select select-bordered w-full"
    >
      <option value="newest">Más recientes</option>
      <option value="oldest">Más antiguos</option>
      <option value="rating">Mejor valorados</option>
    </select>
  </div>

  <hr class="opacity-10" />

  <div *ngIf="loading()" class="flex flex-col items-center justify-center py-20">
    <span class="loading loading-dots loading-lg text-primary"></span>
    <p class="mt-4 opacity-50 italic">Buscando los mejores lugares para ti...</p>
  </div>

  <div *ngIf="!loading()">
    <div *ngIf="places().length > 0; else noResults">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <app-place-card
          *ngFor="let place of places()"
          [place]="place"
          (toggleFavorite)="onToggleFavorite($event)"
        ></app-place-card>
      </div>

      <div *ngIf="totalPages() > 1" class="flex justify-center mt-12 gap-2">
        <button
          class="btn btn-sm btn-outline"
          [disabled]="page() === 1"
          (click)="changePage(page() - 1)"
        >
          ←
        </button>

        <button
          *ngFor="let p of [].constructor(totalPages()); let i = index"
          class="btn btn-sm"
          [ngClass]="{ 'btn-primary': page() === i + 1, 'btn-ghost': page() !== i + 1 }"
          (click)="changePage(i + 1)"
        >
          {{ i + 1 }}
        </button>

        <button
          class="btn btn-sm btn-outline"
          [disabled]="page() === totalPages()"
          (click)="changePage(page() + 1)"
        >
          →
        </button>
      </div>
    </div>
  </div>

  <ng-template #noResults>
    <div
      class="text-center py-20 bg-base-200/50 rounded-3xl border-2 border-dashed border-base-300"
    >
      <div class="text-6xl mb-4">🏜️</div>
      <h3 class="text-xl font-bold opacity-70">No encontramos resultados</h3>
      <p class="opacity-50">Intenta cambiar los filtros o el texto de búsqueda.</p>
      <button
        (click)="search.set(''); selectedCategory.set(''); selectedCity.set(''); applyFilters()"
        class="btn btn-ghost btn-sm mt-4 text-primary"
      >
        Limpiar filtros
      </button>
    </div>
  </ng-template>
</section>
