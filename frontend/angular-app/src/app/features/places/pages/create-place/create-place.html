<section
  class="flex items-center justify-center min-h-[calc(100vh-64px)] from-primary/10 via-base-100 to-secondary/10 px-4"
>
  <div
    class="card w-full max-w-2xl bg-base-100/80 backdrop-blur-md shadow-2xl border border-white/20 animate-fade-in-up"
  >
    <div class="card-body p-8 md:p-10">
      <div class="text-center mb-8">
        <div class="inline-flex p-4 bg-primary/10 rounded-2xl mb-4 shadow-inner">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-primary"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9 20l-5.447-2.724A2 2 0 013 15.488V5.512a2 2 0 011.106-1.789L9 1m0 19v-19m0 19l5.447-2.724A2 2 0 0015.894 15.488V5.512a2 2 0 00-1.106-1.789L9 1m6 18l5.447-2.724A2 2 0 0021 14.512V4.512a2 2 0 00-1.106-1.789L15 1m-3 12V7m-3 3h6"
            />
          </svg>
        </div>
        <h1 class="text-4xl font-black text-primary tracking-tight">Nuevo Destino</h1>
        <p class="opacity-60 font-light mt-2 italic">
          Comparte un rincón especial con la comunidad.
        </p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
      >
        <div class="form-control md:col-span-2">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70"
            >Nombre del lugar</label
          >
          <input
            formControlName="name"
            class="input input-bordered focus:input-primary transition-all bg-base-100/50"
            placeholder="Ej. Terraza del Sol"
            [ngClass]="{ 'input-error': form.get('name')?.touched && form.get('name')?.invalid }"
          />
          <label class="label h-6">
            <span
              *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
              class="label-text-alt text-error animate-pulse"
            >
              El nombre es obligatorio (mín. 3 letras)
            </span>
          </label>
        </div>

        <div class="form-control">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70">
            Categoría
          </label>

          <select
            formControlName="category"
            class="select select-bordered bg-base-100/50 focus:select-primary"
          >
            <option value="">Selecciona una categoría</option>
            <option *ngFor="let cat of categories" [value]="cat">
              {{ cat | titlecase }}
            </option>
          </select>
        </div>

        <div class="form-control">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70"
            >Ubicación</label
          >
          <div class="relative">
            <input
              formControlName="location"
              class="input input-bordered w-full pl-10 focus:input-primary transition-all bg-base-100/50"
              placeholder="Ej. CDMX, México"
            />
            <span class="absolute left-3 top-3.5 opacity-40 text-primary">📍</span>
          </div>
        </div>

        <div class="form-control md:col-span-2">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70">
            Imágenes (Máximo {{ MAX_IMAGES }}) - Llevas {{ images().length }}
          </label>
          <input
            #fileInput
            type="file"
            multiple
            accept="image/*"
            (change)="onFileChange($event)"
            class="file-input file-input-bordered w-full"
            [disabled]="images().length >= MAX_IMAGES"
          />
        </div>

        <div class="md:col-span-2" *ngIf="images().length > 0">
          <div class="flex flex-wrap gap-4 mt-4">
            <div *ngFor="let img of images(); let i = index" class="relative w-24 h-24">
              <img [src]="img" class="w-full h-full object-cover rounded-xl" />
              <button
                type="button"
                (click)="removeImage(i); $event.stopPropagation()"
                class="absolute top-1 right-1 btn btn-xs btn-circle btn-error"
              >
                ✕
              </button>
            </div>
          </div>
        </div>

        <div class="form-control md:col-span-2">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70"
            >Descripción</label
          >
          <textarea
            formControlName="description"
            class="textarea textarea-bordered h-28 focus:textarea-primary transition-all bg-base-100/50"
            placeholder="Cuéntanos qué hace a este lugar especial..."
          ></textarea>
        </div>

        <!-- <div class="md:col-span-2" *ngIf="form.value.image && form.get('image')?.valid">
          <label class="label font-bold text-xs uppercase tracking-widest opacity-70"
            >Vista previa</label
          >
          <div
            class="relative rounded-2xl overflow-hidden shadow-xl border-4 border-white/50 h-48 group"
          >
            <img
              [src]="form.value.image"
              class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
            />
            <div class="absolute inset-0 bg-black/20"></div>
          </div>
        </div> -->

        <div class="md:col-span-2 pt-4">
          <button
            type="submit"
            class="btn btn-primary btn-block"
            [disabled]="form.invalid || loading"
          >
            <span *ngIf="!loading">Publicar Lugar</span>
            <span *ngIf="loading" class="loading loading-spinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
