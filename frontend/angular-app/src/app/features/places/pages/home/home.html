<section
  class="relative h-[75vh] flex items-center justify-center rounded-3xl mx-4 mt-4 overflow-hidden shadow-2xl fade-in-up"
>
  <div class="absolute inset-0">
    <img src="https://picsum.photos/1600/900?blur=2" class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-black/50"></div>
  </div>

  <div class="relative z-10 text-center text-white max-w-2xl px-4">
    <h1 class="text-6xl font-black mb-4 tracking-tighter drop-shadow-lg">
      City<span class="text-secondary">Explorer</span>
    </h1>
    <p class="text-xl mb-8 font-light opacity-90">
      Descubre los rincones más increíbles y guarda tus favoritos en un solo lugar.
    </p>

    <div
      class="flex flex-col md:flex-row gap-3 justify-center items-center bg-white/10 p-2 rounded-2xl backdrop-blur-md border border-white/20 shadow-xl"
    >
      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        (keyup.enter)="onSearch()"
        placeholder="¿A dónde quieres ir?"
        class="input input-bordered w-full md:w-80 text-black focus:border-secondary transition-all"
      />
      <button
        (click)="onSearch()"
        [disabled]="loading()"
        class="btn btn-primary px-8 shadow-lg hover:scale-105 transition-transform"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 mr-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        Buscar
      </button>
    </div>

    <div class="mt-8">
      <a routerLink="/places" class="btn btn-outline btn-secondary border-2 hover:scale-105">
        Explorar todos los lugares
      </a>
    </div>
  </div>
</section>

<section class="max-w-7xl mx-auto mt-16 px-6 pb-16 fade-in-up" style="animation-delay: 0.2s">
  <div class="flex items-center justify-between mb-10">
    <h2 class="text-3xl font-black text-primary tracking-tight">Lugares destacados</h2>
    <div
      class="h-1 flex-grow mx-6 bg-gradient-to-r from-primary/20 to-transparent rounded-full hidden md:block"
    ></div>
  </div>

  <div *ngIf="!loading() && places().length === 0" class="flex justify-center my-10">
    <span class="loading loading-dots loading-lg text-primary"></span>
  </div>

  <div *ngIf="!loading() && places().length === 0" class="text-center py-10 fade-in">
    <p class="text-xl opacity-60">No encontramos coincidencias para "{{ searchTerm() }}"</p>
    <button (click)="searchTerm.set(''); loadPlaces()" class="btn btn-link text-secondary">
      Ver todos los destacados
    </button>
  </div>

  <div *ngIf="!loading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
    <app-place-card
      *ngFor="let p of places()"
      [place]="p"
      (toggleFavorite)="onToggleFavorite($event)"
    ></app-place-card>
  </div>
</section>
