<section
  class="flex items-center justify-center min-h-[calc(100vh-64px)] from-primary/10 via-base-100 to-secondary/10 px-4"
>
  <div
    class="card w-full max-w-md bg-base-100/80 backdrop-blur-md shadow-2xl border border-white/20 animate-fade-in-up"
  >
    <div class="card-body p-8">
      <div class="flex justify-center mb-2">
        <div class="p-3 bg-secondary/10 rounded-full ring-8 ring-secondary/5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-primary"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
            />
          </svg>
        </div>
      </div>

      <h2 class="text-3xl font-black text-center text-primary mb-2 tracking-tight">Crear cuenta</h2>

      <p class="text-center text-sm opacity-60 mb-6 font-light italic">
        Únete y comienza a explorar lugares increíbles.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="form-control">
          <label class="label p-1">
            <span class="label-text font-semibold opacity-70">Nombre de usuario</span>
          </label>
          <div class="relative">
            <input
              type="text"
              formControlName="username"
              autocomplete="username"
              class="input input-bordered w-full pl-10 focus:input-primary transition-all bg-base-100/50"
              placeholder="SantanaDev"
              [ngClass]="{
                'input-error':
                  form.get('username')?.invalid && (form.get('username')?.touched || submitted),
              }"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 absolute left-3 top-3.5 opacity-40 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
          <label class="label h-6">
            <span
              *ngIf="form.get('username')?.invalid && (form.get('username')?.touched || submitted)"
              class="label-text-alt text-error animate-pulse font-medium"
            >
              El nombre es obligatorio (mín. 3 caracteres)
            </span>
          </label>
        </div>

        <div class="form-control">
          <label class="label p-1">
            <span class="label-text font-semibold opacity-70">Correo electrónico</span>
          </label>
          <div class="relative">
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              class="input input-bordered w-full pl-10 focus:input-primary transition-all bg-base-100/50"
              placeholder="correo@ejemplo.com"
              [ngClass]="{
                'input-error':
                  form.get('email')?.invalid && (form.get('email')?.touched || submitted),
              }"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 absolute left-3 top-3.5 opacity-40 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"
              />
            </svg>
          </div>
          <label class="label h-6">
            <span
              *ngIf="form.get('email')?.invalid && (form.get('email')?.touched || submitted)"
              class="label-text-alt text-error animate-pulse font-medium"
            >
              Email inválido
            </span>
          </label>
        </div>

        <div class="form-control">
          <label class="label p-1">
            <span class="label-text font-semibold opacity-70">Contraseña</span>
          </label>
          <div class="relative">
            <input
              type="password"
              formControlName="password"
              class="input input-bordered w-full pl-10 focus:input-primary transition-all bg-base-100/50"
              placeholder="••••••••"
              autocomplete="new-password"
              [ngClass]="{
                'input-error':
                  form.get('password')?.invalid && (form.get('password')?.touched || submitted),
              }"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 absolute left-3 top-3.5 opacity-40 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>
        </div>

        <div class="form-control">
          <label class="label p-1">
            <span class="label-text font-semibold opacity-70">Confirmar contraseña</span>
          </label>
          <div class="relative">
            <input
              type="password"
              formControlName="confirmPassword"
              class="input input-bordered w-full pl-10 focus:input-primary transition-all bg-base-100/50"
              placeholder="••••••••"
              autocomplete="new-password"
              [ngClass]="{
                'input-error':
                  (form.get('confirmPassword')?.invalid || form.hasError('passwordMismatch')) &&
                  (form.get('confirmPassword')?.touched || submitted),
              }"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 absolute left-3 top-3.5 opacity-40 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
              />
            </svg>
          </div>

          <label class="label h-6">
            <span
              *ngIf="
                form.hasError('passwordMismatch') &&
                (form.get('confirmPassword')?.touched || submitted)
              "
              class="label-text-alt text-error animate-pulse font-medium"
            >
              Las contraseñas no coinciden
            </span>
          </label>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full shadow-lg shadow-secondary/20 hover:scale-[1.02] active:scale-[0.98] transition-all border-none mt-2"
          [disabled]="form.invalid"
        >
          Crear cuenta
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 ml-2"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
            />
          </svg>
        </button>
      </form>

      <p class="text-center text-sm mt-6 font-medium">
        ¿Ya tienes cuenta?
        <a
          routerLink="/login"
          class="text-primary font-bold hover:text-secondary transition-colors ml-1"
        >
          Inicia sesión
        </a>
      </p>
    </div>
  </div>
</section>
